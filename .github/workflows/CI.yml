name: Build PSG1218 Firmware

# 触发条件：
#   - 推送到 master 分支：构建并把 .trx 保存到 Artifacts
#   - 推送 tag（v*）：构建并把 .trx 附加到 GitHub Release
#   - 手动触发（workflow_dispatch）
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  TARGET: PSG1218          # 目标机型（Phicomm K2 / PSG1218，64M 内存版）
  IMAGES_DIR: /opt/images  # 产物临时目录

permissions:
  contents: write          # 允许创建/更新 Release 与上传产物

jobs:
  build:
    name: build ${{ env.TARGET }}
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y libtool-bin gperf python3-docutils autopoint gettext

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Build firmware (${{ env.TARGET }})
        run: |
          cd trunk
          mkdir -p ${IMAGES_DIR}
          fakeroot ./build_firmware_ci ${TARGET}
          if [ $? -eq 0 ]; then
            cp -f images/*.trx ${IMAGES_DIR}/
          else
            echo "Build failed"; tail -60 build.log; exit 1
          fi
          echo "================= Build OK ================="
          ls -lh ${IMAGES_DIR}

      - name: Upload TRX to Artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}-firmware
          path: ${{ env.IMAGES_DIR }}/*.trx
          if-no-files-found: error

      - name: Upload TRX to Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && success() }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IMAGES_DIR }}/*.trx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
